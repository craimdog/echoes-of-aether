name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Typecheck server
        run: npm run typecheck --workspace=server

      - name: Typecheck client
        run: cd client && npx tsc --noEmit -p tsconfig.app.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client
        run: npm run build --workspace=client
        env:
          VITE_API_URL: https://placeholder.example.com
          VITE_WS_URL: https://placeholder.example.com
          NODE_OPTIONS: --max-old-space-size=4096